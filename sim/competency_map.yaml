# competency_map.yaml
#
# Маппинг тегов тем КТП → компетенции Foundation §3.
#
# Пять компетенций (ключи верхнего уровня):
#   C1_programming   — программирует как инженер
#   C2_data          — работает с данными
#   C3_ml            — применяет ML
#   C4_math          — мыслит математически
#   C5_artifacts     — создаёт артефакты
#
# Каждая запись: список подстрок (case-insensitive), которые при совпадении
# с тегом темы засчитывают вклад в компетенцию.
# Один тег может вносить вклад в несколько компетенций.
#
# Редактировать при добавлении новых модулей или уточнении маппинга.

